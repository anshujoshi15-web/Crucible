<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract admin · Crucible</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#0e100f;color:#f5f4eb;--accent:#d7fc76;--line:#30352e;--muted:#a7afa3}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid var(--line);padding:16px 0}main,header div{width:min(760px,calc(100% - 32px));margin:auto}main{padding:38px 0}a{color:var(--accent)}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1;letter-spacing:-.06em;margin:0 0 16px}h2{margin-top:0}.panel{background:#151816;border:1px solid var(--line);border-radius:9px;padding:20px;margin:18px 0}label{display:block;margin:10px 0 4px}input,select,button{font:inherit;border-radius:5px;padding:9px 12px}input,select{display:block;width:100%;background:#0e100f;color:inherit;border:1px solid #41493d}button{background:var(--accent);color:#151816;border:0;font-weight:650;margin-top:14px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}code{overflow-wrap:anywhere}.muted{color:var(--muted)}#status,#tx-status{overflow-wrap:anywhere}fieldset{border:0;padding:0;margin:0;min-width:0}p:last-child{margin-bottom:0}

.brand{display:inline-flex;align-items:center;gap:.55rem;white-space:nowrap}
.crucible-mark{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;background:#d7fc76;flex:none}


h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;letter-spacing:-.045em}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:1.5rem}
.crucible-mark{background:#d7fc76;border-radius:8px}


.site-footer{border-top:1px solid #30352e;padding:24px 0;color:#a7afa3;font-size:.85rem}
.site-footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.site-footer nav{display:flex;flex-wrap:wrap;gap:8px 20px}
.site-footer nav a{display:inline-flex;align-items:center;min-height:44px}
.site-footer a:hover{text-decoration:underline}
.site-footer .wrap{width:min(760px,calc(100% - 32px));margin:auto}
.crucible-mark{object-fit:contain;background:transparent}
</style>
<header><div><a class="brand" href="/"><img class="crucible-mark" src="/crucible-logo.png" width="34" height="34" alt="">Crucible</a></div></header>
<main>
<h1>Contract admin</h1>
<p class="muted">Manage the Crucible Registry on Base Mainnet.</p>
<section class="panel" aria-labelledby="access">
<h2 id="access">House access</h2>
<p class="muted">Authorized wallet <code id="house"></code></p>
<button type="button" id="connect">Connect wallet</button>
<label for="registry">Deployed Registry address</label>
<input id="registry" placeholder="0x…" spellcheck="false" autocomplete="off">
<button type="button" id="verify">Verify registry</button>
<p role="status" id="status">Connect the House wallet to continue.</p>
</section>
<section class="panel" aria-labelledby="actions">
<h2 id="actions">Registry actions</h2>
<form id="action-form">
<fieldset id="controls" disabled>
<label for="action">Action</label>
<select id="action"></select>
<div id="fields"></div>
<button type="submit">Review in wallet</button>
</fieldset>
</form>
<p role="status" id="tx-status"></p>
</section>
</main>
<footer class="site-footer"><div class="wrap"><a class="brand" href="/"><img class="crucible-mark" src="/crucible-logo.png" width="34" height="34" alt="">Crucible</a><nav aria-label="Footer"><a href="/#seeds">Seed board</a><a href="/about">About</a><a href="/help">Help</a><a href="/contact">Contact</a><a href="/admin">Contract admin</a></nav><span>House of Joshi</span></div></footer>
<script src="/admin.js"></script>
</html>
